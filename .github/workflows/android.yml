name: Android APK
on:
  push:
    branches: [android-local-apk]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install pinned Android build components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Native offline tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror android/native-tests/sql_test.cpp -o /tmp/bounty-sql-test
          /tmp/bounty-sql-test
      - name: Build, lint and test
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Print lint errors on failure
        if: failure()
        run: cat android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Bounty-Workbench.apk
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/runtime-tests.apk
          cd dist
          sha256sum Bounty-Workbench.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Bounty-Workbench-APK
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html

  runtime-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Bounty-Workbench-APK
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install dist/Bounty-Workbench.apk
            adb install dist/runtime-tests.apk
            adb shell am instrument -w dz.timo.bounty.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -q 'OK (' instrumentation.txt
            mkdir -p screenshots
            adb pull /sdcard/Android/data/dz.timo.bounty/files/ screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-evidence
          path: |
            instrumentation.txt
            screenshots/
