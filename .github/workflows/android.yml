name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install pinned Android build components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Native offline tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror android/native-tests/sql_test.cpp -o /tmp/bounty-sql-test
          /tmp/bounty-sql-test
      - name: Build, lint and test
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Bounty-Workbench.apk
          cd dist
          sha256sum Bounty-Workbench.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Bounty-Workbench-APK
          path: dist/*
          if-no-files-found: error
      - name: Publish installable test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${GITHUB_RUN_NUMBER}" dist/Bounty-Workbench.apk dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Bounty Workbench Android · build ${GITHUB_RUN_NUMBER}" --notes "Installable debug-signed Android APK. Kotlin + C++ JNI, Android 8+. Includes bounded HEAD/TLS/TCP checks and local SQL review. Nmap/sqlmap are not bundled. Debug signing is for personal testing; upgrades across CI builds may need uninstalling the previous build."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
